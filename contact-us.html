<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelBloom - Contact Us</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav-bar"><span class="brand">TravelBloom</span><a href="index.html">Home</a><a href="about-us.html">About Us</a><a href="contact-us.html" class="active">Contact Us</a></nav>
<main><h1>Contact Us</h1><p>Send us a message and we will reply by email.</p>
<form class="contact-form" id="contact-form">
<label for="name">Name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea>
<button type="submit">Send message</button><p id="form-status" role="status"></p>
</form></main>
<script>document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('form-status').textContent='Thank you! Your message has been sent.';this.reset();});</script>
</body></html>
